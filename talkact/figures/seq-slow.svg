<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 985" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs>
<rect x="0" y="0" width="1600" height="985" fill="#f7f2e9"/>
<text x="90.78014184397163" y="44" font-size="26" font-weight="700" fill="#000000">The slow loop: every action carries the digest</text>
<text x="90.78014184397163" y="74" font-size="15" fill="#000000">A tool-use loop whose mandatory side output is the other agent&#x27;s grounding</text>
<line x1="233" y1="110" x2="233" y2="917" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="113" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="233" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Slow agent</text>
<line x1="516" y1="110" x2="516" y2="917" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="397" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="516" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">LLM (tool use)</text>
<line x1="800" y1="110" x2="800" y2="917" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="681" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="800" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Browser (Playwright)</text>
<line x1="1084" y1="110" x2="1084" y2="917" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="965" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1084" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">SharedState</text>
<line x1="1367" y1="110" x2="1367" y2="917" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1248" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1367" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Task site</text>
<line x1="233" y1="191" x2="790" y2="191" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="438" cy="177" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="438" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1</text>
<text x="456" y="182" font-size="14" fill="#000000">observe(): indexed elements + page text + screenshot</text>
<line x1="800" y1="252" x2="243" y2="252" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="438" cy="238" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="438" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="456" y="243" font-size="14" fill="#000000">observation</text>
<line x1="233" y1="313" x2="1074" y2="313" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="580" cy="299" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="580" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="598" y="304" font-size="14" fill="#000000">drain fast_to_slow: notes join the observation as [PHONE CHANNEL]</text>
<line x1="233" y1="374" x2="506" y2="374" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="296" cy="360" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="296" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="314" y="365" font-size="14" fill="#000000">messages + tools (tool_choice: any — a tool is mandatory)</text>
<line x1="516" y1="436" x2="243" y2="436" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="296" cy="422" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="296" y="427" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="314" y="427" font-size="14" fill="#000000">one or more tool calls, each with state_summary</text>
<line x1="233" y1="497" x2="1074" y2="497" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="580" cy="483" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="580" y="488" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">6</text>
<text x="598" y="488" font-size="14" fill="#000000">state_summary -&gt; digest (written before the tool runs)</text>
<line x1="233" y1="558" x2="790" y2="558" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="438" cy="544" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="438" y="549" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="456" y="549" font-size="14" fill="#000000">click / type / select / navigate by [n] index</text>
<line x1="800" y1="620" x2="1357" y2="620" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="1006" cy="606" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="1006" y="611" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">8</text>
<text x="1024" y="611" font-size="14" fill="#000000">page action</text>
<line x1="233" y1="681" x2="506" y2="681" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="296" cy="667" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="296" y="672" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">9</text>
<text x="314" y="672" font-size="14" fill="#000000">tool results — only the last carries the new observation</text>
<path d="M 233 742 h 50 v 30 H 243" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="258" cy="726" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="258" y="731" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">10</text>
<text x="293" y="747" font-size="14" fill="#000000">repeat, up to 60 steps; screenshots trimmed to the newest 2</text>
<rect x="113" y="776" width="1373" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="803" text-anchor="middle" font-size="14" fill="#000000">ask_user / tell_user are ordinary tools here: they enqueue a message and return at once. The loop never blocks on the conversation.</text>
<line x1="233" y1="876" x2="1074" y2="876" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="580" cy="862" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="580" y="867" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">11</text>
<text x="598" y="867" font-size="14" fill="#000000">task_done(result) -&gt; slow_done + slow_result</text>
</svg>