<text x="110.3448275862069" y="44" font-size="26" font-weight="700" fill="#ece1d3">The app-server substrate: one protocol, many frontends</text>
<text x="110.3448275862069" y="74" font-size="15" fill="#a89880">openai/codex rust-v0.160.0 - every interface is an RPC client</text>
