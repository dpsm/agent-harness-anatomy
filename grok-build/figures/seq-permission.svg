<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 908" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs>
<rect x="0" y="0" width="1600" height="908" fill="#f7f2e9"/>
<text x="77.10843373493975" y="44" font-size="26" font-weight="700" fill="#000000">A permission decision through the pipeline</text>
<text x="77.10843373493975" y="74" font-size="15" fill="#000000">search_replace in default mode — five tiers get their say before the user does</text>
<line x1="198" y1="110" x2="198" y2="850" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="96" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="198" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Tool call</text>
<line x1="439" y1="110" x2="439" y2="850" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="337" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="439" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Hooks</text>
<line x1="680" y1="110" x2="680" y2="850" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="578" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="680" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Rules</text>
<line x1="920" y1="110" x2="920" y2="850" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="819" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="920" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Grants</text>
<line x1="1161" y1="110" x2="1161" y2="850" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1060" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1161" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Auto-approvals</text>
<line x1="1402" y1="110" x2="1402" y2="850" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1301" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1402" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Mode policy</text>
<rect x="96" y="139" width="1407" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="166" text-anchor="middle" font-size="14" fill="#000000">One search_replace call, default mode — each tier can settle it or pass it down</text>
<line x1="198" y1="224" x2="429" y2="224" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="240" cy="210" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="240" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1</text>
<text x="258" y="215" font-size="14" fill="#000000">PreToolUse hooks run first</text>
<line x1="439" y1="276" x2="208" y2="276" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="240" cy="262" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="240" y="267" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="258" y="267" font-size="14" fill="#000000">no deny (an approve skips nothing)</text>
<line x1="198" y1="328" x2="670" y2="328" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="361" cy="314" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="361" y="319" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="379" y="319" font-size="14" fill="#000000">merged rules: CLI + .grok + .claude + managed</text>
<line x1="680" y1="380" x2="208" y2="380" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="361" cy="366" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="361" y="371" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="379" y="371" font-size="14" fill="#000000">no deny / ask / allow match</text>
<line x1="198" y1="432" x2="910" y2="432" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="481" cy="418" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="481" y="423" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="499" y="423" font-size="14" fill="#000000">remembered per-project grants?</text>
<line x1="920" y1="484" x2="208" y2="484" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="481" cy="470" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="481" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">6</text>
<text x="499" y="475" font-size="14" fill="#000000">none yet (dangerous commands re-prompt)</text>
<line x1="198" y1="536" x2="1151" y2="536" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="602" cy="522" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="602" y="527" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="620" y="527" font-size="14" fill="#000000">read-only tool or command list?</text>
<line x1="1161" y1="588" x2="208" y2="588" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="602" cy="574" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="602" y="579" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">8</text>
<text x="620" y="579" font-size="14" fill="#000000">an edit is not read-only</text>
<rect x="96" y="617" width="1407" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="644" text-anchor="middle" font-size="14" fill="#000000">Chained commands are split per segment — git -c, sort --compress-program, rg --pre push a call back to a prompt</text>
<line x1="198" y1="702" x2="1392" y2="702" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="688" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="693" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">9</text>
<text x="740" y="693" font-size="14" fill="#000000">mode policy: default</text>
<line x1="1402" y1="754" x2="208" y2="754" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="722" cy="740" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="722" y="745" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">10</text>
<text x="740" y="745" font-size="14" fill="#000000">prompt the user</text>
<rect x="96" y="783" width="1407" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="810" text-anchor="middle" font-size="14" fill="#000000">Approve &#x27;always allow in this project&#x27; -&gt; the grant is stored -&gt; the call executes</text>
</svg>