<text x="722" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="740" y="297" font-size="14" fill="#000000">reply: grep (same call as last step)</text>
<line x1="283" y1="381" x2="618" y2="381" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="377" cy="367" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="377" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="395" y="372" font-size="14" fill="#000000">hash the step signature</text>
<line x1="628" y1="455" x2="293" y2="455" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="377" cy="441" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="377" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="395" y="446" font-size="14" fill="#000000">signature (order-insensitive)</text>
<line x1="283" y1="530" x2="962" y2="530" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="550" cy="516" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="550" y="521" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="568" y="521" font-size="14" fill="#000000">record step</text>
<line x1="972" y1="604" x2="293" y2="604" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="550" cy="590" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="550" y="595" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">6</text>
<text x="568" y="595" font-size="14" fill="#000000">run = 5 identical steps</text>
<rect x="138" y="646" width="1324" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="673" text-anchor="middle" font-size="14" fill="#000000">The same call keeps coming back — the run tracker keeps counting</text>
<line x1="283" y1="767" x2="962" y2="767" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="550" cy="753" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="550" y="758" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="568" y="758" font-size="14" fill="#000000">record step (run = 8)</text>
<line x1="972" y1="841" x2="293" y2="841" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="550" cy="827" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="550" y="832" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">8</text>
<text x="568" y="832" font-size="14" fill="#000000">nudge threshold hit (reads/plan: 4)</text>
<line x1="283" y1="916" x2="1307" y2="916" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="902" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="907" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">9</text>
<text x="740" y="907" font-size="14" fill="#000000">next request + nudge reminder in context</text>
<line x1="1317" y1="990" x2="293" y2="990" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="722" cy="976" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="722" y="981" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">10</text>
<text x="740" y="981" font-size="14" fill="#000000">reply: the same grep again</text>
<line x1="283" y1="1065" x2="962" y2="1065" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="550" cy="1051" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="550" y="1056" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">11</text>
<text x="568" y="1056" font-size="14" fill="#000000">record step (run = 12)</text>
<line x1="972" y1="1139" x2="293" y2="1139" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="550" cy="1125" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="550" y="1130" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">12</text>
<text x="568" y="1130" font-size="14" fill="#000000">hard-stop threshold hit</text>
<path d="M 283 1214 h 61 v 36 H 293" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="313" cy="1198" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="313" y="1203" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">13</text>
<text x="353" y="1219" font-size="14" fill="#000000">turn ends: guard stop — no budget was set</text>
<rect x="138" y="1255" width="1324" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="1282" text-anchor="middle" font-size="14" fill="#000000">True no-op runs — calls that succeed but change nothing — stop earlier, at 4</text>
</svg>