<rect x="1172" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1317" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Model</text>
<line x1="283" y1="232" x2="1307" y2="232" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="218" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1</text>
<text x="740" y="223" font-size="14" fill="#000000">request with the conversation</text>
<line x1="1317" y1="306" x2="293" y2="306" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
