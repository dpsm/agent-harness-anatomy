<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1434" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs>
<rect x="0" y="0" width="1600" height="1434" fill="#f7f2e9"/>
<text x="110.3448275862069" y="44" font-size="26" font-weight="700" fill="#000000">The stationarity guard stops a looping run</text>
<text x="110.3448275862069" y="74" font-size="15" fill="#000000">No turn budget is set — repetition, not count, is what ends this run</text>
<line x1="283" y1="110" x2="283" y2="1352" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="138" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="283" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Turn loop</text>
<line x1="628" y1="110" x2="628" y2="1352" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="483" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="628" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Step hasher</text>
<line x1="972" y1="110" x2="972" y2="1352" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="828" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="972" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Run tracker</text>
