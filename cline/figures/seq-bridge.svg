<text x="90.78014184397163" y="44" font-size="26" font-weight="700" fill="#e6edf3">The bridge: webview -&gt; proto-bus gRPC -&gt; host -&gt; SDK -&gt; back</text>
<text x="90.78014184397163" y="74" font-size="15" fill="#8b949e">The loop never sees the wire; it only ever sees SDK events</text>
