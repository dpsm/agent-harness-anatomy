<rect x="819" y="82" width="202" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="920" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">Private refs</text>
<line x1="1161" y1="110" x2="1161" y2="571" stroke="#30363d" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1060" y="82" width="202" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="1161" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">SdkController</text>
