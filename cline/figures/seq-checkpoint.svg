<text x="1222" y="371" font-size="14" fill="#e6edf3">/undo</text>
<rect x="1161" y="413" width="58" height="33" rx="6" fill="none" stroke="#58a6ff" stroke-width="2"/>
<text x="1233" y="432" font-size="14" fill="#8b949e">refuse if HEAD moved past the checkpoint</text>
<line x1="1161" y1="484" x2="690" y2="484" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="842" cy="470" r="11" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="842" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">6</text>
<text x="860" y="475" font-size="14" fill="#e6edf3">update-ref HEAD + reset --hard + clean -fd + stash apply</text>
<line x1="1161" y1="536" x2="930" y2="536" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="963" cy="522" r="11" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="963" y="527" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">7</text>
<text x="981" y="527" font-size="14" fill="#e6edf3">pre-restore tx snapshot -&gt; refs/cline/restore-transactions/{uuid}</text>
