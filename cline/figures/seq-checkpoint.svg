<circle cx="963" cy="522" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="963" y="527" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="981" y="527" font-size="14" fill="#000000">pre-restore tx snapshot -&gt; refs/cline/restore-transactions/{uuid}</text>
