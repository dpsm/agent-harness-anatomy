<circle cx="240" cy="148" r="11" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="240" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">1</text>
<text x="258" y="153" font-size="14" fill="#e6edf3">beforeModel({snapshot}) -- iteration 1 only</text>
<line x1="439" y1="214" x2="670" y2="214" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="481" cy="200" r="11" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="481" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">2</text>
<text x="499" y="205" font-size="14" fill="#e6edf3">git stash create (+ 3rd-parent commit for untracked)</text>
<line x1="680" y1="266" x2="910" y2="266" stroke="#6e7681" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="722" cy="252" r="11" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<text x="722" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">3</text>
<text x="740" y="257" font-size="14" fill="#e6edf3">update-ref refs/cline/checkpoints/{session}/{run}</text>
<rect x="96" y="295" width="925" height="44" rx="8" fill="#1f6feb22" stroke="#1f6feb" stroke-width="1"/>
<text x="559" y="322" text-anchor="middle" font-size="14" fill="#e6edf3">User&#x27;s own repo -- no shadow repo; per-session GIT_INDEX_FILE leaves the user index alone</text>
