<rect x="337" y="82" width="202" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="439" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">Checkpoint hook</text>
