<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 628" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#58a6ff"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6e7681"/></marker></defs>
<text x="77.10843373493975" y="44" font-size="26" font-weight="700" fill="#e6edf3">Checkpoints: snapshot on beforeModel, transaction-guarded restore</text>
<text x="77.10843373493975" y="74" font-size="15" fill="#8b949e">Per-turn worktree snapshots; the docs still describe the old shadow-repo system</text>
<line x1="198" y1="110" x2="198" y2="571" stroke="#30363d" stroke-width="2" stroke-dasharray="8 6"/>
