<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1182" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs><rect x="0" y="0" width="1600" height="1182" fill="#f7f2e9"/>
<text x="140.65934065934067" y="44" font-size="26" font-weight="700" fill="#000000">Cline: spawn_agent delegation</text>
<text x="140.65934065934067" y="74" font-size="15" fill="#000000">Delegation, not templating: the child runs the whole loop</text>
<line x1="360" y1="110" x2="360" y2="1076" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="176" y="82" width="369" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="360" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Parent agent</text>
<line x1="800" y1="110" x2="800" y2="1076" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="615" y="82" width="369" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="800" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">spawn_agent</text>
<line x1="1240" y1="110" x2="1240" y2="1076" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1055" y="82" width="369" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1240" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Child agent</text>
<line x1="360" y1="295" x2="790" y2="295" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="502" cy="281" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="502" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1</text>
<text x="520" y="286" font-size="14" fill="#000000">model calls spawn_agent(task, systemPrompt)</text>
<line x1="800" y1="390" x2="1230" y2="390" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="942" cy="376" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="942" y="381" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="960" y="381" font-size="14" fill="#000000">createDelegatedAgent({kind:&#x27;subagent&#x27;, tools, policies})</text>
<rect x="176" y="443" width="1248" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="470" text-anchor="middle" font-size="14" fill="#000000">Child inherits tool policies + approval callback; executionMode:&#x27;parallel&#x27; — the only parallel built-in</text>
<path d="M 1240 598 h 77 v 46 H 1250" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="1278" cy="582" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="1278" y="587" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="1327" y="603" font-size="14" fill="#000000">subAgent.run(task)</text>
<rect x="176" y="651" width="1248" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="678" text-anchor="middle" font-size="14" fill="#000000">Full AgentRuntime loop in the child; parent waits (onSubAgentStart/End are best-effort observers)</text>
<line x1="1240" y1="805" x2="810" y2="805" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="942" cy="791" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="942" y="796" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="960" y="796" font-size="14" fill="#000000">{text, iterations, finishReason, usage}</text>
<line x1="800" y1="900" x2="370" y2="900" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="502" cy="886" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="502" y="891" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="520" y="891" font-size="14" fill="#000000">result as tool result</text>
<rect x="176" y="953" width="1248" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="980" text-anchor="middle" font-size="14" fill="#000000">team_* tools share the AgentTool shape for multi-agent coordination; legacy YAML agents (-&gt; use_subagent_*) are the older lane</text>
</svg>