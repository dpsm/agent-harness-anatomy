<text x="395" y="460" font-size="14" fill="#000000">adapter.classify(input)</text>
<line x1="283" y1="543" x2="618" y2="543" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
