<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1848" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs>
<rect x="0" y="0" width="1600" height="1848" fill="#f7f2e9"/>
<text x="110.3448275862069" y="44" font-size="26" font-weight="700" fill="#000000">Channel turn: the 7-stage admission pipeline</text>
<text x="110.3448275862069" y="74" font-size="15" fill="#000000">ingest -&gt; classify -&gt; preflight -&gt; resolve -&gt; assemble -&gt; dispatch -&gt; finalize</text>
