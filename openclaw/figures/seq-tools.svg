<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1550" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs>
<rect x="0" y="0" width="1600" height="1550" fill="#f7f2e9"/>
<text x="110.3448275862069" y="44" font-size="26" font-weight="700" fill="#000000">Tool dispatch: the approval chain</text>
<text x="110.3448275862069" y="74" font-size="15" fill="#000000">surface assembly -&gt; tool search -&gt; ordered approvals -&gt; execute -&gt; audit</text>
<line x1="283" y1="110" x2="283" y2="1468" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="138" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="283" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Agent loop</text>
<line x1="628" y1="110" x2="628" y2="1468" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="483" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="628" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">ToolRegistry</text>
<line x1="972" y1="110" x2="972" y2="1468" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="828" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="972" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Approval authority</text>
<line x1="1317" y1="110" x2="1317" y2="1468" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1172" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1317" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Tool executor</text>
<line x1="283" y1="232" x2="618" y2="232" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="377" cy="218" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="377" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1</text>
<text x="395" y="223" font-size="14" fill="#000000">surface assembly: 6 tool sources</text>
<rect x="138" y="273" width="1324" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="300" text-anchor="middle" font-size="14" fill="#000000">Core + shell + channel + OpenClaw + plugin + Tool Search, then policy filters.</text>
<line x1="283" y1="394" x2="618" y2="394" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="377" cy="380" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="377" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="395" y="385" font-size="14" fill="#000000">tool_call(name, args)</text>
<path d="M 628 469 h 61 v 36 H 638" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="658" cy="453" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="658" y="458" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="698" y="474" font-size="14" fill="#000000">Tool Search: materialize on demand?</text>
<rect x="138" y="510" width="1324" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="537" text-anchor="middle" font-size="14" fill="#000000">Most tools never enter model context; control tools materialize them per call.</text>
<path d="M 628 632 h 61 v 36 H 638" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="658" cy="616" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="658" y="621" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="698" y="637" font-size="14" fill="#000000">before-tool-call policy chain</text>
<rect x="138" y="673" width="1324" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="700" text-anchor="middle" font-size="14" fill="#000000">Order is behavior: loop admission -&gt; owner probes -&gt; voice confirm -&gt; trusted policies -&gt; approvals -&gt; hooks -&gt; final owner approval.</text>
<line x1="628" y1="794" x2="962" y2="794" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="780" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="785" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="740" y="785" font-size="14" fill="#000000">requestApproval(tool, ctx)</text>
<path d="M 972 869 h 61 v 36 H 982" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="1003" cy="853" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="1003" y="858" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">6</text>
<text x="1043" y="874" font-size="14" fill="#000000">route to channel UX</text>
<rect x="138" y="910" width="1324" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="937" text-anchor="middle" font-size="14" fill="#000000">Approval surfaces on whatever channel is available (e.g. Telegram native buttons). Deferred approvals supported.</text>
<line x1="972" y1="1032" x2="638" y2="1032" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="722" cy="1018" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="722" y="1023" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="740" y="1023" font-size="14" fill="#000000">approved | denied | deferred</text>
<line x1="628" y1="1106" x2="1307" y2="1106" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="894" cy="1092" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="894" y="1097" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">8</text>
<text x="912" y="1097" font-size="14" fill="#000000">execute(toolCallId, params)</text>
<line x1="1317" y1="1181" x2="638" y2="1181" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="894" cy="1167" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="894" y="1172" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">9</text>
<text x="912" y="1172" font-size="14" fill="#000000">AgentToolResult</text>
<path d="M 628 1255 h 61 v 36 H 638" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="658" cy="1239" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="658" y="1244" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">10</text>
<text x="698" y="1260" font-size="14" fill="#000000">record decision + hashed receipt</text>
<rect x="138" y="1297" width="1324" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="1324" text-anchor="middle" font-size="14" fill="#000000">Allowed/denied/suppressed recorded with hashed receipts in src/audit/.</text>
<line x1="628" y1="1418" x2="293" y2="1418" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="377" cy="1404" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="377" y="1409" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">11</text>
<text x="395" y="1409" font-size="14" fill="#000000">result string</text>
</svg>