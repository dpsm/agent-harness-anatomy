<circle cx="296" cy="628" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="296" y="633" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">6</text>
<text x="314" y="633" font-size="14" fill="#000000">send_message: get_user_message_suffix(message)</text>
<path d="M 516 704 h 50 v 29 H 526" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="541" cy="688" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="541" y="693" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="576" y="709" font-size="14" fill="#000000">match KeywordTrigger / TaskTrigger / PathTrigger</text>
