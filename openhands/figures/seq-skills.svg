<circle cx="296" cy="751" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="296" y="756" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">8</text>
<text x="314" y="756" font-size="14" fill="#000000">suffix + triggered names (recorded in activated_knowledge_skills)</text>
