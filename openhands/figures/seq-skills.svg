<circle cx="580" cy="372" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="580" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="598" y="377" font-size="14" fill="#000000">list AgentSkills skills (desc truncated to 1024 chars)</text>
