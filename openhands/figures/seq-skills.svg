<text x="1148" y="890" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">9</text>
<text x="1166" y="890" font-size="14" fill="#000000">invoke_skill(name)</text>
<line x1="1367" y1="960" x2="810" y2="960" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="1006" cy="946" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="1006" y="951" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">10</text>
<text x="1024" y="951" font-size="14" fill="#000000">render skill content (executes inline !commands)</text>
<line x1="1367" y1="1021" x2="1094" y2="1021" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="1148" cy="1007" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="1148" y="1012" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">11</text>
<text x="1166" y="1012" font-size="14" fill="#000000">InvokeSkillObservation (unless disable_model_invocation)</text>
