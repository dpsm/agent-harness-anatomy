<text x="800" y="826" text-anchor="middle" font-size="14" fill="#000000">Path 3: model invocation — the model calls the invoke_skill builtin tool</text>
<line x1="1084" y1="899" x2="1357" y2="899" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
