<circle cx="580" cy="433" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="580" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="598" y="438" font-size="14" fill="#000000">Skill list</text>
