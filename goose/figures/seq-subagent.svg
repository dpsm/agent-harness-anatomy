<text x="520" y="286" font-size="14" fill="#ece1d3">model calls delegate(source, task, async?)</text>
<line x1="800" y1="390" x2="1230" y2="390" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
