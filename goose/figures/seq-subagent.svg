<rect x="615" y="82" width="369" height="56" rx="10" fill="#1f1a15" stroke="#3a2f26" stroke-width="1.5"/>
<text x="800" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#ece1d3">summon</text>
