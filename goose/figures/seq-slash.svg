<circle cx="502" cy="281" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="502" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1</text>
<text x="520" y="286" font-size="14" fill="#000000">user types &#x27;/mode approve&#x27;</text>
<path d="M 800 390 h 77 v 46 H 810" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="838" cy="374" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="838" y="379" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="887" y="395" font-size="14" fill="#000000">execute_command(text, session_id) before the loop</text>
