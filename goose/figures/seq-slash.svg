<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1182" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs><rect x="0" y="0" width="1600" height="1182" fill="#f7f2e9"/>
<text x="140.65934065934067" y="44" font-size="26" font-weight="700" fill="#000000">Goose: slash-command intercept + mode switch</text>
<text x="140.65934065934067" y="74" font-size="15" fill="#000000">Slash input never reaches the model raw</text>
