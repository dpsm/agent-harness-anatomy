<text x="800" y="470" text-anchor="middle" font-size="14" fill="#000000">reply() intercepts slash input at agent.rs:2222 — before hooks, before inference</text>
<path d="M 800 598 h 77 v 46 H 810" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="838" cy="582" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="838" y="587" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="887" y="603" font-size="14" fill="#000000">parse_slash_command -&gt; dispatch</text>
<line x1="800" y1="693" x2="1230" y2="693" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="942" cy="679" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="942" y="684" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="960" y="684" font-size="14" fill="#000000">GooseMode switched for the session</text>
<rect x="176" y="745" width="1248" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="772" text-anchor="middle" font-size="14" fill="#000000">Mode changes take effect on the next turn; the state machine models this as SlashCommandOperation, step 2 of 18</text>
<line x1="800" y1="900" x2="370" y2="900" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="502" cy="886" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="502" y="891" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="520" y="891" font-size="14" fill="#000000">confirmation message</text>
<rect x="176" y="953" width="1248" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="980" text-anchor="middle" font-size="14" fill="#000000">Goal/grind commands go further: they inject a kickoff user message and fall straight into the reply loop</text>
