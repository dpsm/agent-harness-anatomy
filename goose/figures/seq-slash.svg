<text x="960" y="684" font-size="14" fill="#ece1d3">GooseMode switched for the session</text>
<rect x="176" y="745" width="1248" height="44" rx="8" fill="#d08c4e22" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="795" text-anchor="middle" font-size="14" fill="#ece1d3">Mode changes take effect on the next turn; the state machine models this as SlashCommandOperation, step 2 of 18</text>
