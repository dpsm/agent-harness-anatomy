<rect x="176" y="82" width="369" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="360" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">User</text>
<line x1="800" y1="110" x2="800" y2="1076" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="615" y="82" width="369" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="800" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Agent.reply</text>
<line x1="1240" y1="110" x2="1240" y2="1076" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1055" y="82" width="369" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1240" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Session config</text>
