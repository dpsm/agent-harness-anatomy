<rect x="176" y="953" width="1248" height="44" rx="8" fill="#d08c4e22" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="1002" text-anchor="middle" font-size="14" fill="#ece1d3">Goal/grind commands go further: they inject a kickoff user message and fall straight into the reply loop</text>
