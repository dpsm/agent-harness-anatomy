<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 839" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#58a6ff"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6e7681"/></marker></defs>
<text x="110.3448275862069" y="44" font-size="26" font-weight="700" fill="#e6edf3">Goose: scheduled recipe execution</text>
<text x="110.3448275862069" y="74" font-size="15" fill="#8b949e">Cron over recipes; the agent can schedule its own future runs</text>
<line x1="283" y1="110" x2="283" y2="756" stroke="#30363d" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="138" y="82" width="290" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="283" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">Cron job</text>
<line x1="628" y1="110" x2="628" y2="756" stroke="#30363d" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="483" y="82" width="290" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="628" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">Scheduler</text>
<line x1="972" y1="110" x2="972" y2="756" stroke="#30363d" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="828" y="82" width="290" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="972" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">Recipe</text>
<line x1="1317" y1="110" x2="1317" y2="756" stroke="#30363d" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1172" y="82" width="290" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="1317" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">Agent session</text>
<line x1="283" y1="232" x2="618" y2="232" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="377" cy="218" r="11" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="377" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">1</text>
<text x="395" y="223" font-size="14" fill="#e6edf3">cron expression fires (tokio-cron-scheduler)</text>
<rect x="628" y="279" width="83" height="47" rx="6" fill="none" stroke="#58a6ff" stroke-width="2"/>
<text x="730" y="306" font-size="14" fill="#8b949e">paused? -&gt; skip; else persist last_run</text>
<line x1="628" y1="381" x2="962" y2="381" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="367" r="11" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="722" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">3</text>
<text x="740" y="372" font-size="14" fill="#e6edf3">execute_job: read + validate recipe</text>
<rect x="138" y="422" width="979" height="44" rx="8" fill="#1f6feb22" stroke="#1f6feb" stroke-width="1"/>
<text x="628" y="461" text-anchor="middle" font-size="14" fill="#e6edf3">Recipe file format checked; relative sub-recipe/template refs survive the copy to scheduled_recipes/</text>
<line x1="628" y1="543" x2="1307" y2="543" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="894" cy="529" r="11" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="894" y="534" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">4</text>
<text x="912" y="534" font-size="14" fill="#e6edf3">session_manager: run recipe in Auto mode</text>
<rect x="483" y="585" width="979" height="44" rx="8" fill="#1f6feb22" stroke="#1f6feb" stroke-width="1"/>
<text x="972" y="623" text-anchor="middle" font-size="14" fill="#e6edf3">Always Auto — a scheduled job is headless by construction; headless Approve/SmartApprove is a hard error</text>
<line x1="1317" y1="706" x2="638" y2="706" stroke="#6e7681" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="894" cy="692" r="11" fill="#161b22" stroke="#6e7681" stroke-width="1.5"/>
<text x="894" y="697" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">5</text>
<text x="912" y="697" font-size="14" fill="#e6edf3">result persisted on session record</text>
