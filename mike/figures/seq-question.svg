<text x="882" y="561" font-size="14" fill="#000000">parent title + prompt as context</text>
<line x1="1367" y1="631" x2="526" y2="631" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="864" cy="617" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="864" y="622" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="882" y="622" font-size="14" fill="#000000">numbered answers replace the tool result</text>
