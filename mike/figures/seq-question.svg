<circle cx="580" cy="299" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="580" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="598" y="304" font-size="14" fill="#000000">no: card -&gt; Review, executor exits</text>
<line x1="1084" y1="374" x2="526" y2="374" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
