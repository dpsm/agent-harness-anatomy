<text x="740" y="365" font-size="14" fill="#000000">the person&#x27;s answer (a new message)</text>
<path d="M 516 436 h 50 v 30 H 526" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="541" cy="420" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="541" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="576" y="441" font-size="14" fill="#000000">conversation rebuilt from rows; run resumes</text>
