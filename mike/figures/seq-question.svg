<circle cx="541" cy="236" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="541" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="576" y="257" font-size="14" fill="#000000">was this run auto-started?</text>
