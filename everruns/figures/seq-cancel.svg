<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 974" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs>
<rect x="0" y="0" width="1600" height="974" fill="#f7f2e9"/>
<text x="110.3448275862069" y="44" font-size="26" font-weight="700" fill="#000000">Cancel ends only its own turn</text>
<text x="110.3448275862069" y="74" font-size="15" fill="#000000">The cancel carries the inbox position it targets</text>
<line x1="283" y1="110" x2="283" y2="891" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="138" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="283" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">User</text>
<line x1="628" y1="110" x2="628" y2="891" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="483" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="628" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Control plane</text>
<line x1="972" y1="110" x2="972" y2="891" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="828" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="972" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Worker (holder)</text>
<line x1="1317" y1="110" x2="1317" y2="891" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1172" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1317" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Session log</text>
<line x1="283" y1="232" x2="618" y2="232" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="377" cy="218" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="377" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1</text>
<text x="395" y="223" font-size="14" fill="#000000">message 1 (turn running on the holder)</text>
<line x1="283" y1="306" x2="618" y2="306" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="377" cy="292" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="377" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="395" y="297" font-size="14" fill="#000000">POST /sessions/{id}/cancel</text>
<path d="M 628 381 h 61 v 36 H 638" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="658" cy="365" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="658" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="698" y="386" font-size="14" fill="#000000">record cancel on the actor row, at its inbox position</text>
<line x1="628" y1="455" x2="962" y2="455" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="441" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="740" y="446" font-size="14" fill="#000000">cancel notification: holder renews now and sees it</text>
<line x1="972" y1="530" x2="1307" y2="530" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="1067" cy="516" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="1067" y="521" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="1085" y="521" font-size="14" fill="#000000">append turn.cancelled (exactly one terminal event)</text>
<line x1="283" y1="604" x2="618" y2="604" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="377" cy="590" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="377" y="595" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">6</text>
<text x="395" y="595" font-size="14" fill="#000000">message 2 — sent after the cancel</text>
<line x1="628" y1="679" x2="1307" y2="679" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="894" cy="665" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="894" y="670" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="912" y="670" font-size="14" fill="#000000">stored + actor runnable; the pending cancel does not reach it</text>
<line x1="972" y1="753" x2="1307" y2="753" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="1067" cy="739" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="1067" y="744" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">8</text>
<text x="1085" y="744" font-size="14" fill="#000000">next lease: message 2 starts a fresh turn</text>
<rect x="138" y="794" width="1324" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="821" text-anchor="middle" font-size="14" fill="#000000">A position is sound where a clear-on-release is not: nothing must run after turn.cancelled to stop it applying</text>
</svg>