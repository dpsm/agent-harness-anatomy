<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 941" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs>
<rect x="0" y="0" width="1600" height="941" fill="#f7f2e9"/>
<text x="77.10843373493975" y="44" font-size="26" font-weight="700" fill="#000000">One turn through the actor loop</text>
<text x="77.10843373493975" y="74" font-size="15" fill="#000000">Intake and the runnable mark commit together; one lease runs the whole turn</text>
<line x1="198" y1="110" x2="198" y2="883" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="96" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="198" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">App (Agent API)</text>
<line x1="439" y1="110" x2="439" y2="883" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="337" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="439" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Control plane</text>
<line x1="680" y1="110" x2="680" y2="883" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="578" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="680" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">PostgreSQL log</text>
<line x1="920" y1="110" x2="920" y2="883" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="819" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="920" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Worker</text>
<line x1="1161" y1="110" x2="1161" y2="883" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1060" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1161" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">LLM</text>
<line x1="1402" y1="110" x2="1402" y2="883" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1301" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1402" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Tools</text>
<line x1="198" y1="162" x2="429" y2="162" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="240" cy="148" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="240" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1</text>
<text x="258" y="153" font-size="14" fill="#000000">POST /sessions/{id}/messages</text>
<line x1="439" y1="214" x2="670" y2="214" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="481" cy="200" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="481" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="499" y="205" font-size="14" fill="#000000">one transaction: append input.message + mark actor runnable</text>
<line x1="439" y1="266" x2="910" y2="266" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="602" cy="252" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="602" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="620" y="257" font-size="14" fill="#000000">wake-up: session_actor notification</text>
<line x1="920" y1="318" x2="690" y2="318" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="304" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="309" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="740" y="309" font-size="14" fill="#000000">lease session (fence raised, TTL 10s)</text>
<line x1="920" y1="370" x2="690" y2="370" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="356" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="740" y="361" font-size="14" fill="#000000">fold tail from latest turn.started</text>
<line x1="920" y1="422" x2="1151" y2="422" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="963" cy="408" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="963" y="413" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">6</text>
<text x="981" y="413" font-size="14" fill="#000000">reason: model call</text>
<line x1="1161" y1="474" x2="930" y2="474" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="963" cy="460" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="963" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="981" y="465" font-size="14" fill="#000000">tool calls</text>
<line x1="920" y1="526" x2="690" y2="526" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="512" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="517" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">8</text>
<text x="740" y="517" font-size="14" fill="#000000">append llm.generation (the recorded response)</text>
<line x1="920" y1="578" x2="1392" y2="578" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="1083" cy="564" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="1083" y="569" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">9</text>
<text x="1101" y="569" font-size="14" fill="#000000">act: run tool calls in parallel</text>
<line x1="1402" y1="630" x2="930" y2="630" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="1083" cy="616" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="1083" y="621" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">10</text>
<text x="1101" y="621" font-size="14" fill="#000000">results</text>
<line x1="920" y1="682" x2="690" y2="682" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="668" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="673" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">11</text>
<text x="740" y="673" font-size="14" fill="#000000">append tool.completed per call, then reason again</text>
<line x1="920" y1="734" x2="690" y2="734" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="720" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="725" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">12</text>
<text x="740" y="725" font-size="14" fill="#000000">append output.message.completed + turn.completed; release lease</text>
<line x1="439" y1="787" x2="208" y2="787" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="240" cy="773" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="240" y="778" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">13</text>
<text x="258" y="778" font-size="14" fill="#000000">SSE: events stream from the same log</text>
<rect x="96" y="815" width="1407" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="842" text-anchor="middle" font-size="14" fill="#000000">No queue hop between reason and act — the lease, not a task chain, carries the turn</text>
</svg>