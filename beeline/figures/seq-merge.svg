<rect x="113" y="837" width="1373" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="864" text-anchor="middle" font-size="14" fill="#000000">A new commit cancels the yes; a brief edit does not. A hold is the only veto, and yolo is not a merge condition</text>
