<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 862" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs>
<rect x="0" y="0" width="1600" height="862" fill="#f7f2e9"/>
<text x="90.78014184397163" y="44" font-size="26" font-weight="700" fill="#000000">zenclaw: a write, three tiers, and the snapshot timer</text>
<text x="90.78014184397163" y="74" font-size="15" fill="#000000">PSRAM cache -&gt; coalesced replication -&gt; flash snapshot every 900 s</text>
<line x1="233" y1="110" x2="233" y2="794" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="113" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="233" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Session store</text>
<line x1="516" y1="110" x2="516" y2="794" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="397" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="516" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">PSRAM cache</text>
<line x1="800" y1="110" x2="800" y2="794" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="681" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="800" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Replicator</text>
<line x1="1084" y1="110" x2="1084" y2="794" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="965" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1084" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">S3 bucket</text>
<line x1="1367" y1="110" x2="1367" y2="794" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1248" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1367" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Snapshot timer / flash</text>
<line x1="233" y1="191" x2="506" y2="191" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="296" cy="177" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="296" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1</text>
<text x="314" y="182" font-size="14" fill="#000000">append: extend active log-NN in cache</text>
<line x1="516" y1="252" x2="790" y2="252" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="580" cy="238" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="580" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="598" y="243" font-size="14" fill="#000000">enqueue(log key, whole updated blob)</text>
<path d="M 800 313 h 50 v 30 H 810" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="825" cy="297" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="825" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="860" y="318" font-size="14" fill="#000000">coalesce: same key already queued -&gt; replace bytes</text>
<line x1="800" y1="374" x2="1074" y2="374" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="864" cy="360" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="864" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="882" y="365" font-size="14" fill="#000000">drainer: SigV4 PUT</text>
<line x1="1084" y1="436" x2="810" y2="436" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="864" cy="422" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="864" y="427" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="882" y="427" font-size="14" fill="#000000">error: backoff 2^(n-1) s, retry to retry_max</text>
<path d="M 800 497 h 50 v 30 H 810" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="825" cy="481" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="825" y="486" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">6</text>
<text x="860" y="502" font-size="14" fill="#000000">still failing: demote to dead-letter list</text>
<line x1="233" y1="558" x2="506" y2="558" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="296" cy="544" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="296" y="549" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="314" y="549" font-size="14" fill="#000000">log reaches 16,384 B: fold into base.jsonl</text>
<line x1="1367" y1="620" x2="526" y2="620" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="864" cy="606" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="864" y="611" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">8</text>
<text x="882" y="611" font-size="14" fill="#000000">every 900 s: snapshot() the whole cache</text>
<line x1="516" y1="681" x2="1357" y2="681" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="864" cy="667" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="864" y="672" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">9</text>
<text x="882" y="672" font-size="14" fill="#000000">write .snapshot.bin.tmp, sync, rename over old</text>
<rect x="113" y="715" width="1373" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="742" text-anchor="middle" font-size="14" fill="#000000">wear by avoidance</text>
</svg>