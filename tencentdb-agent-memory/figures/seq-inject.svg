<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1123" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs>
<rect x="0" y="0" width="1600" height="1123" fill="#f7f2e9"/>
<text x="110.3448275862069" y="44" font-size="26" font-weight="700" fill="#000000">Injection on a later request: what re-enters the prompt, and what stays a tool</text>
<text x="110.3448275862069" y="74" font-size="15" fill="#000000">L2/L3 are injected; L1 is recalled per turn; L0/L1 stay queryable so the KV cache survives</text>
<line x1="283" y1="110" x2="283" y2="1040" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="138" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="283" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Agent harness</text>
<line x1="628" y1="110" x2="628" y2="1040" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="483" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="628" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">MemoryProxy</text>
<line x1="972" y1="110" x2="972" y2="1040" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="828" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="972" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">MemoryCore</text>
<line x1="1317" y1="110" x2="1317" y2="1040" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1172" y="82" width="290" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1317" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Upstream LLM</text>
<line x1="283" y1="232" x2="618" y2="232" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="377" cy="218" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="377" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1</text>
<text x="395" y="223" font-size="14" fill="#000000">new session: POST with a fresh question</text>
<line x1="628" y1="306" x2="962" y2="306" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="292" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="740" y="297" font-size="14" fill="#000000">read L2 profile + L3 persona for this agent</text>
<line x1="628" y1="381" x2="962" y2="381" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="367" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="740" y="372" font-size="14" fill="#000000">fixed bindings: ACL check per borrowed asset (deny on error)</text>
<line x1="972" y1="455" x2="638" y2="455" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="722" cy="441" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="722" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="740" y="446" font-size="14" fill="#000000">allowed assets only</text>
<path d="M 628 530 h 61 v 36 H 638" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="658" cy="514" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="658" y="519" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="698" y="535" font-size="14" fill="#000000">inject L2/L3 + skill summaries into the system prompt</text>
<line x1="628" y1="604" x2="962" y2="604" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="590" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="595" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">6</text>
<text x="740" y="595" font-size="14" fill="#000000">L1 recall: hybrid search on the cleaned question</text>
<line x1="972" y1="679" x2="638" y2="679" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="722" cy="665" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="722" y="670" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="740" y="670" font-size="14" fill="#000000">top 5 atoms, tagged by source agent (max 2 borrowed)</text>
<path d="M 628 753 h 61 v 36 H 638" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="658" cy="737" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="658" y="742" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">8</text>
<text x="698" y="758" font-size="14" fill="#000000">prepend recalled atoms to the current user turn</text>
<line x1="628" y1="828" x2="1307" y2="828" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="894" cy="814" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="894" y="819" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">9</text>
<text x="912" y="819" font-size="14" fill="#000000">forward: system prompt + turn; L0/L1 remain tools</text>
<line x1="1317" y1="902" x2="293" y2="902" stroke="#8a7a66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<circle cx="722" cy="888" r="11" fill="#ffffff" stroke="#8a7a66" stroke-width="1.5"/>
<text x="722" y="893" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">10</text>
<text x="740" y="893" font-size="14" fill="#000000">answer, streamed back through the proxy</text>
<rect x="138" y="943" width="1324" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="970" text-anchor="middle" font-size="14" fill="#000000">One agent reads another&#x27;s memory only via a human-made binding or ACL grant, checked per asset</text>
</svg>