<rect x="1301" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1402" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Side panel</text>
