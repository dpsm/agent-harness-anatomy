<rect x="1060" y="82" width="202" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1161" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Plugin MCP server</text>
