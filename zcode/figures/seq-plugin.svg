<text x="481" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="499" y="205" font-size="14" fill="#000000">catalog fetch; CDN plugins are sha256-checked zips</text>
<line x1="198" y1="266" x2="429" y2="266" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="240" cy="252" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
