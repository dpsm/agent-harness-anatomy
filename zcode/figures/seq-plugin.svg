<text x="1083" y="413" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">6</text>
<text x="1101" y="413" font-size="14" fill="#000000">tool result carries a ui resource -&gt; panel opens</text>
<line x1="198" y1="474" x2="1392" y2="474" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="460" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">7</text>
<text x="740" y="465" font-size="14" fill="#000000">edit the document directly</text>
<line x1="1402" y1="526" x2="1171" y2="526" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="1204" cy="512" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="1204" y="517" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">8</text>
<text x="1222" y="517" font-size="14" fill="#000000">commit (one undo history for user + agent edits)</text>
<rect x="96" y="555" width="1407" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="582" text-anchor="middle" font-size="14" fill="#000000">Interactive panels run in local desktop workspaces at this pin; web and remote keep ordinary tool records</text>
