<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 617" width="1600" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d08c4e"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a7a66"/></marker></defs>
<rect x="0" y="0" width="1600" height="617" fill="#f7f2e9"/>
<text x="90.78014184397163" y="44" font-size="26" font-weight="700" fill="#000000">What leaves the machine at the pinned commit</text>
<text x="90.78014184397163" y="74" font-size="15" fill="#000000">Each flow below is gated or explicit — see the article&#x27;s audit for the evidence</text>
<line x1="233" y1="110" x2="233" y2="549" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="113" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="233" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">ZCode app</text>
<line x1="516" y1="110" x2="516" y2="549" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="397" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="516" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Telemetry endpoint</text>
<line x1="800" y1="110" x2="800" y2="549" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="681" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="800" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">OTLP collector</text>
<line x1="1084" y1="110" x2="1084" y2="549" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="965" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1084" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Update feed</text>
<line x1="1367" y1="110" x2="1367" y2="549" stroke="#3a2f26" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="1248" y="82" width="238" height="56" rx="10" fill="#ffffff" stroke="#3a2f26" stroke-width="1.5"/>
<text x="1367" y="116" text-anchor="middle" font-size="16" font-weight="600" fill="#000000">Provider API</text>
<line x1="233" y1="191" x2="506" y2="191" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="296" cy="177" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="296" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">1</text>
<text x="314" y="182" font-size="14" fill="#000000">event metadata — only if the build set an endpoint</text>
<line x1="233" y1="252" x2="790" y2="252" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="438" cy="238" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="438" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">2</text>
<text x="456" y="243" font-size="14" fill="#000000">traces + metrics — only if the host env sets OTLP</text>
<line x1="233" y1="313" x2="1074" y2="313" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="580" cy="299" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="580" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">3</text>
<text x="598" y="304" font-size="14" fill="#000000">update check (desktop, every 15 min)</text>
<line x1="233" y1="374" x2="1357" y2="374" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="722" cy="360" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="722" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">4</text>
<text x="740" y="365" font-size="14" fill="#000000">prompts + tool results (the model call itself)</text>
<path d="M 233 436 h 50 v 30 H 243" fill="none" stroke="#d08c4e" stroke-width="2" marker-end="url(#arrc)"/>
<circle cx="258" cy="420" r="11" fill="#ffffff" stroke="#d08c4e" stroke-width="1.5"/>
<text x="258" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">5</text>
<text x="293" y="441" font-size="14" fill="#000000">workspace checkpoints: local git objects, never uploaded</text>
<rect x="113" y="470" width="1373" height="44" rx="8" fill="#d08c4e" fill-opacity="0.13" stroke="#d08c4e" stroke-width="1"/>
<text x="800" y="497" text-anchor="middle" font-size="14" fill="#000000">No background workspace-upload path exists at this pin; sharing and feedback upload only on explicit user action</text>
